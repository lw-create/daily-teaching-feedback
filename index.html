<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="refresh" content="15; url=daily-teaching-feedback.html">
<meta name="cache-control" content="no-cache, no-store, must-revalidate">
<title>每日教学反馈生成器</title>
<link rel="canonical" href="daily-teaching-feedback.html">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#f0f4f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;color:#333;
}
.loader-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:32px 24px;text-align:center;max-width:340px;
}
.logo{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#2d9d78,#1a8b5f);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:20px;
  box-shadow:0 4px 16px rgba(45,157,120,0.25);
}
.spinner{
  width:36px;height:36px;
  border:3px solid rgba(45,157,120,0.15);
  border-top-color:#2d9d78;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin-bottom:16px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.title{font-size:1.15rem;font-weight:700;color:#1a8b5f;margin-bottom:8px;}
.status{font-size:0.85rem;color:#888;line-height:1.5;margin-bottom:6px;}
.retry-hint{font-size:0.75rem;color:#aaa;margin-top:4px;}
.progress-bar{
  width:160px;height:3px;background:rgba(45,157,120,0.12);
  border-radius:2px;overflow:hidden;margin:12px 0 4px;
}
.progress-fill{
  width:0%;height:100%;background:#2d9d78;border-radius:2px;
  transition:width 0.4s ease;
}
.retry-btn{
  display:none;margin-top:16px;padding:8px 24px;
  background:#2d9d78;color:#fff;border:none;border-radius:8px;
  font-size:0.85rem;cursor:pointer;
}
.retry-btn:active{opacity:0.8;}
.retry-btn.show{display:inline-block;}
.dot{animation:blink 1.4s infinite both;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0;}30%{opacity:1;}}
</style>
</head>
<body>
<div class="loader-wrap">
  <div class="logo">🌱</div>
  <div class="spinner" id="spinner"></div>
  <div class="title">每日教学反馈生成器</div>
  <div class="status" id="statusText">正在加载中，请稍候<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="retry-hint" id="retryHint">首次打开可能需要等待几秒，请耐心等待</div>
  <button class="retry-btn" id="retryBtn" onclick="manualRetry()">🔄 手动重试</button>
</div>
<noscript>
  <p style="text-align:center;margin-top:20px;">
    <a href="daily-teaching-feedback.html" style="color:#2d9d78;font-size:1.1rem;">点击进入工具</a>
  </p>
</noscript>
<script>
(function(){
  var MAIN_PAGE = 'daily-teaching-feedback.html';
  var statusText = document.getElementById('statusText');
  var progressFill = document.getElementById('progressFill');
  var retryHint = document.getElementById('retryHint');
  var retryBtn = document.getElementById('retryBtn');
  var retryCount = 0;
  var maxRetries = 30; // 30次 × 2秒 = 最多等60秒
  var progress = 0;
  var redirected = false;

  // 进度条动画
  var progressTimer = setInterval(function(){
    if(progress < 90){
      progress += Math.random() * 6;
      if(progress > 90) progress = 90;
      progressFill.style.width = progress + '%';
    }
  }, 300);

  function goToMain(){
    if(redirected) return;
    redirected = true;
    progressFill.style.width = '100%';
    clearInterval(progressTimer);
    statusText.innerHTML = '加载完成，正在进入...';
    setTimeout(function(){
      window.location.replace(MAIN_PAGE);
    }, 200);
  }

  function tryLoad(){
    retryCount++;
    var url = MAIN_PAGE + '?t=' + Date.now();

    // 方式1: 用 Image 对象探测（不受 CORS 限制）
    var img = new Image();
    var done = false;
    
    img.onload = function(){
      done = true;
      goToMain();
    };
    img.onerror = function(){
      // onerror 也说明服务器有响应（HTML 页面不是图片，所以 onerror 是正常的）
      done = true;
      goToMain();
    };
    img.src = url + '&img=1';

    // 方式2: fetch HEAD 检测
    fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(function(resp){
        if(!done && (resp.ok || resp.status === 200 || resp.status === 304)){
          goToMain();
        }
      })
      .catch(function(err){
        if(!done){
          // 更新提示文字
          if(retryCount === 1){
            statusText.innerHTML = '正在连接服务器...';
          } else if(retryCount >= 2){
            statusText.innerHTML = '服务器正在准备中，请稍候';
            retryHint.textContent = '已自动重试 ' + retryCount + ' 次，即将再次尝试...';
            retryBtn.classList.add('show');
          }
          if(retryCount < maxRetries){
            // 2秒后自动重试（缩短间隔）
            setTimeout(function(){
              if(!redirected) tryLoad();
            }, 2000);
          } else {
            // 超过最大重试次数，尝试直接跳转
            clearInterval(progressTimer);
            statusText.innerHTML = '⚠️ 加载时间较长，正在尝试直接进入...';
            retryHint.textContent = '如果页面空白，请刷新重试';
            setTimeout(function(){
              if(!redirected) window.location.replace(MAIN_PAGE);
            }, 1000);
          }
        }
      });

    // 4秒超时：如果 Image 和 fetch 都没触发，也尝试跳转
    setTimeout(function(){
      if(!redirected && retryCount === 1){
        goToMain();
      }
    }, 4000);
  }

  // 启动加载
  tryLoad();
})();

function manualRetry(){
  location.reload();
}
</script>
</body>
</html>
